name: CI Orchestrator

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/deploy_docs.yml'
      - '.github/workflows/issue-orchestrator.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/deploy_docs.yml'
      - '.github/workflows/issue-orchestrator.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      switch: ${{ steps.filter.outputs.switch }}
      python: ${{ steps.filter.outputs.python }}
      custom_components: ${{ steps.filter.outputs.custom_components }}
      hacs: ${{ steps.filter.outputs.hacs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            switch:
              - 'sysmodule/**'
              - 'overlay/**'
              - 'overlay-loader/**'
              - 'source/**'
              - 'include/**'
              - 'romfs/**'
              - 'assets/**'
              - 'Makefile'
              - 'version.mk'
            python:
              - 'scripts/**'
              - '.github/scripts/**'
              - 'tests/**'
              - '**/*.py'
              - 'pyproject.toml'
            custom_components:
              - 'custom_components/**'
            hacs:
              - 'hacs.json'

  lint-test:
    name: Lint & Test
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.outputs.python == 'true' || needs.changes.outputs.custom_components == 'true')
    runs-on: ubuntu-latest
    outputs:
      has_components: ${{ steps.check_integration.outputs.has_components }}
      has_hacs: ${{ steps.check_integration.outputs.has_hacs }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          if [ -d custom_components ]; then
            pip install ruff mypy pyyaml pytest pytest-asyncio pytest-cov homeassistant paramiko aiohttp pytest-homeassistant-custom-component beautifulsoup4
          else
            pip install ruff mypy pyyaml pytest pytest-asyncio pytest-cov
          fi

      - name: Validate JSON/YAML
        run: |
          python -c "import json, glob; [json.load(open(f, encoding='utf-8-sig')) for f in glob.glob('**/*.json', recursive=True)]"
          python -c "import yaml, glob; yaml.add_multi_constructor('tag:yaml.org,2002:python/name:', lambda loader, suffix, node: None, Loader=yaml.SafeLoader); yaml.add_multi_constructor('!', lambda loader, suffix, node: None, Loader=yaml.SafeLoader); [yaml.safe_load(open(f, encoding='utf-8-sig')) for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)]"

      - name: Check Integration Structure
        id: check_integration
        run: |
          if [ -d custom_components ]; then
            DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
            test -d "custom_components/$DOMAIN"
            test -f "custom_components/$DOMAIN/manifest.json"
            echo "has_components=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_components=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f hacs.json ]; then
            echo "has_hacs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_hacs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Format and Fix with Ruff
        run: |
          ruff check --fix . || true
          ruff format . || true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "style: auto-fix and format with Ruff [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force"

      - name: Run Mypy
        run: |
          if [ -d custom_components ]; then
            DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
            mypy "custom_components/$DOMAIN"
          fi

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            DOMAIN=$(python -c "import json, glob; matches = glob.glob('custom_components/*/manifest.json'); print(json.load(open(matches[0]))['domain']) if matches else 'test'")
            PYTHONPATH=. pytest --cov="custom_components.$DOMAIN" --cov-report=xml || pytest
          else
            echo "No tests directory found, skipping."
            echo "<?xml version='1.0' ?><coverage></coverage>" > coverage.xml
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  hassfest:
    name: Validate with Hassfest
    runs-on: ubuntu-latest
    needs: lint-test
    if: needs.lint-test.outputs.has_components == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs-validation:
    name: Validate HACS
    runs-on: ubuntu-latest
    needs: lint-test
    if: needs.lint-test.outputs.has_hacs == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  codeql:
    name: CodeQL Analysis
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.outputs.python == 'true' || needs.changes.outputs.custom_components == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1

  validate-sysmodule:
    name: Validate Sysmodule & Build
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.switch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate JSON Structure and Syscalls
        run: |
          if [ -f sysmodule/switch-ha-sysmodule.json ]; then
            python3 scripts/validate_sysmodule.py sysmodule/switch-ha-sysmodule.json
          fi
          if [ -f overlay-loader/switch-ha-overlay-loader.json ]; then
            python3 scripts/validate_sysmodule.py overlay-loader/switch-ha-overlay-loader.json
          fi

      - name: Verify Sysmodule, Overlay & App Compilation
        uses: docker://devkitpro/devkita64:latest
        with:
          args: /bin/bash -c "export PATH=$PATH:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin && (cd sysmodule && make install-layout) && (cd overlay && make) && (cd overlay-loader && make install-layout) && mkdir -p romfs/sysmodule romfs/overlay-loader romfs/overlay && cp sysmodule/atmosphere/contents/00FF000053484101/exefs.nsp romfs/sysmodule/exefs.nsp && touch romfs/sysmodule/boot2.flag && cp overlay-loader/atmosphere/contents/00FF000053484102/exefs.nsp romfs/overlay-loader/exefs.nsp && touch romfs/overlay-loader/boot2.flag && cp overlay/switch-ha-overlay.ovl romfs/overlay/switch-ha-overlay.ovl && rm -rf build switch-ha.elf switch-ha.nro && make"

      - name: Package Switch Binaries
        run: |
          mkdir -p dist/switch dist/atmosphere/contents/00FF000053484101/flags dist/atmosphere/contents/00FF000053484102/flags
          cp switch-ha.nro dist/switch/switch-ha.nro || true
          cp overlay/switch-ha-overlay.ovl dist/switch/switch-ha-overlay.ovl || true
          cp sysmodule/atmosphere/contents/00FF000053484101/exefs.nsp dist/atmosphere/contents/00FF000053484101/exefs.nsp || true
          touch dist/atmosphere/contents/00FF000053484101/flags/boot2.flag
          cp overlay-loader/atmosphere/contents/00FF000053484102/exefs.nsp dist/atmosphere/contents/00FF000053484102/exefs.nsp || true

      - name: Upload Switch Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: switch-binaries
          path: dist/

  auto-merge:
    name: Auto Merge Renovate
    runs-on: ubuntu-latest
    needs: [changes, lint-test, hassfest, hacs-validation, codeql, validate-sysmodule]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.actor == 'renovate[bot]' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable Auto Merge
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
